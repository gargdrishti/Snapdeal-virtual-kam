<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>What-if planner – Snapdeal Virtual KAM</title><link rel="icon" href="snapdeal-icon.png"><link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="shell.css"></head><body><header><div class="brand"><img src="snapdeal-icon.png" width="28" height="28" alt="Snapdeal">Snapdeal <small>Virtual KAM</small></div><nav data-nav></nav></header><main>
<div class="hd"><div><h1>What-if planner</h1><p class="sub">Move the levers to see how much of the lost sales each fix could win back. Only levers that match this seller's actual causes are offered.</p></div>
<label class="meta">SELLER<br><select class="sel" id="sel" aria-label="Seller"></select></label></div>
<div class="two"><section class="card" id="left"></section><section class="card" id="right"></section></div>
</main><script src="nav.js"></script><script type="module">
import {project,LABEL} from "./plan.js";
const P=await api("/api/portfolio"),S=P.sellers.filter(s=>s.drop>0);let s,lv;
$("sel").innerHTML=S.map(x=>`<option value="${x.id}">${x.name}</option>`).join("");
const want=new URLSearchParams(location.search).get("seller");if(want&&S.find(x=>x.id===want))$("sel").value=want;
$("sel").onchange=pick;pick();
function pick(){s=S.find(x=>x.id===$("sel").value);lv={sale:true};s.causes.forEach(c=>lv[c.key]=.5);
 $("left").innerHTML=`<h3>${s.name} <small>down ${s.dropPct}%</small></h3>`+s.causes.map(c=>`<div class="act"><b><span>${c.label}</span><span class="red">${inr(c.rupees)}</span></b><span class="meta">${c.fix}</span></div>`).join("")+`<h3 style="margin-top:16px"><small>LEVERS</small></h3>`+s.causes.map(c=>`<div class="lever"><div class="h"><span>${LABEL[c.key]}</span><b id="v-${c.key}"></b></div><input type="range" min="0" max="100" value="50" data-k="${c.key}" aria-label="${LABEL[c.key]}"><span class="meta">Share of the fix completed. Recovers up to ${Math.round(c.recover*100)}% of ${inr(c.rupees)}.</span></div>`).join("")+`<div class="lever"><label class="h"><span><input type="checkbox" id="sale" checked> Enrol in Year-End Sale</span></label><span class="meta">+25% on the event week (starts in 21 days)</span></div>`;
 document.querySelectorAll("[data-k]").forEach(i=>i.oninput=()=>{lv[i.dataset.k]=i.value/100;draw()});$("sale").onchange=e=>{lv.sale=e.target.checked;draw()};draw()}
function draw(){const r=project(s,lv);s.causes.forEach(c=>$("v-"+c.key).textContent=Math.round(lv[c.key]*100)+"%");
 const m=Math.max(s.lastSales,r.projected),row=(l,v,col)=>`<div class="cmp"><span>${l}</span><div class="t"><i style="width:${v/m*100}%;background:${col}"></i></div><b>${inr(v)}</b></div>`;
 $("right").innerHTML=`<h3>Projected month</h3><div class="big">${inr(r.projected)}</div><div class="green">+${inr(r.gain)} vs the current run-rate · ${r.vsLast>=0?"+":""}${r.vsLast.toFixed(1)}% vs last month</div><div style="margin:14px 0">${row("Last month",s.lastSales,"#8a8cb0")}${row("This month so far",s.sales,"#E40046")}${row("With this plan",r.projected,"#39D98A")}</div><h3><small>WHERE THE RECOVERY COMES FROM</small></h3>`+(r.parts.filter(p=>p.v).map(p=>`<div class="act"><b><span>${p.label}</span><span class="green">+${inr(p.v)}</span></b></div>`).join("")||'<p class="meta">Move a lever to see the recovery.</p>')+`<p class="meta" style="margin:12px 0">Projection from the diagnosis model with stated assumptions: a planning aid, not a promise.</p><button class="btn" id="go">Have Riya put this plan in motion</button>`;
 $("go").onclick=async()=>{const acts=s.causes.filter(c=>lv[c.key]>0).map((c,i)=>({title:"Fix task: "+LABEL[c.key],ref:"PLN-"+(3000+i),detail:c.fix+` (${Math.round(lv[c.key]*100)}% target)`}));if(lv.sale)acts.push({title:"Enrol in Year-End Sale",ref:"PLN-3099",detail:"Eligible listings enrolled"});
  await api("/api/calls",{sellerId:s.id,type:"Riya called",outcome:"Actions agreed",actions:acts,said:`Plan from what-if planner: projected ${inr(r.projected)}`});$("go").textContent="Plan in motion ✓ Opening history…";$("go").classList.add("ok");setTimeout(()=>location.href="history.html",900)}}
</script></body></html>
